# Site du projet : https://kaggle.d1dev.fr (README + docs/ rendus côté client)
name: kaggle-site
services:
  web:
    image: nginx:alpine
    container_name: kaggle-site
    restart: unless-stopped
    volumes:
      - ..:/srv:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [d1dev_web]
    labels:
      traefik.enable: "false"
networks:
  d1dev_web:
    external: true
