# Sert uniquement index.html, les .md publics de la racine et docs/*.md (jamais .env, bench/, etc.)
server {
  listen 80;
  root /srv;
  location = / { try_files /site/index.html =404; }
  location ~ ^/(README|ETAT|DECISIONS|REGLES|KIT)\.md$ { default_type text/markdown; charset utf-8; add_header Cache-Control no-cache; }
  location ~ ^/docs/[A-Za-z0-9_-]+\.md$ { default_type text/markdown; charset utf-8; add_header Cache-Control no-cache; }
  location / { return 404; }
}
