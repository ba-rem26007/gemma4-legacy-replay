# Configuration Axolotl pour Gemma 4 (31B ou E4B/12B) - Débogage Agentique
# Spécificités : attention hybride obligatoire pour global_head_dim 512, QK-RMSNorm max_grad_norm 0.1

base_model: google/gemma-4-31B-it
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_4bit: true
adapter: qlora

# Attention hybride obligatoire pour la taille de tête 512 de Gemma 4
gemma4_hybrid_attn_impl: true
attn_implementation: flash_attention_2

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

datasets:
  - path: trajectories/train.jsonl
    type: chat_template
    chat_template: gemma
  - path: trajectories/self.jsonl
    type: chat_template
    chat_template: gemma

output_dir: ./training/lora_axolotl

sequence_len: 8192
sample_packing: true
pad_to_sequence_len: true

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 3
optimizer: paged_adamw_8bit
learning_rate: 5e-5
lr_scheduler: cosine
warmup_ratio: 0.05
max_grad_norm: 0.1

bf16: true
fp16: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
